name: Build ChatGPT IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build unsigned
        run: |
          xcodebuild \
            -project ChatGPTWrapper.xcodeproj \
            -scheme ChatGPTWrapper \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath ./build

      - name: Package IPA
        run: |
          APP=$(find ./build -name "*.app" | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ChatGPT.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-iOS15
          path: ChatGPT.ipa
          retention-days: 30
